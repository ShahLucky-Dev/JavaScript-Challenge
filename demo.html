<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>after long time</title>
  </head>
  <body>
    <h1>here my after long time coding...</h1>
    <h2 id="bdy">pls click the button to change the color of the background</h2>
    <button id="btn">Click to Change</button>
  </body>
  <script>
    let btn = document.getElementById("btn");
    btn.addEventListener("click", () => {
      document.getElementById("bdy").style.backgroundColor = "orange";
    });
  </script>
</html>
